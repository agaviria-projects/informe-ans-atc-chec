<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mapa ANS ELITE</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f7;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .panel {
            position: fixed;
            top: 18px;
            right: 18px;
            width: 340px;
            max-height: calc(100vh - 36px);
            overflow-y: auto;
            padding: 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25);
            z-index: 9999;
        }

        .panel h2 {
            margin: 0;
            color: #1b2631;
            font-size: 22px;
        }

        .subtitulo {
            margin-top: 4px;
            margin-bottom: 16px;
            color: #00843d;
            font-size: 13px;
            font-weight: 600;
        }

        .panel label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            color: #34495e;
            font-size: 13px;
            font-weight: 700;
        }

        .campo,
        .selector {
            width: 100%;
            padding: 10px;
            border: 1px solid #aab7b8;
            border-radius: 7px;
            background: #ffffff;
            font-size: 14px;
        }

        .fila-botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
            margin-top: 8px;
        }

        .boton {
            width: 100%;
            padding: 10px 8px;
            border: none;
            border-radius: 7px;
            background: #1e8449;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .boton:hover {
            filter: brightness(1.08);
        }

        .boton-secundario {
            background: #5d6d7e;
        }

        .boton-azul {
            background: #2471a3;
        }

        .boton-copiar {
            background: #25d366;
        }

        .estados {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
            margin-top: 8px;
        }

        .estado {
            padding: 9px 5px;
            border: none;
            border-radius: 7px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .estado-alerta {
            color: #1b2631;
        }

        .contador {
            margin-top: 14px;
            padding: 10px;
            border-radius: 8px;
            background: #eaf2f8;
            color: #1b2631;
            font-weight: 700;
            text-align: center;
        }

        .nota {
            margin-top: 12px;
            padding: 9px;
            border-left: 4px solid #2471a3;
            background: #ebf5fb;
            color: #1f618d;
            font-size: 12px;
            line-height: 1.4;
        }

        .fecha {
            margin-top: 12px;
            color: #7b7d7d;
            font-size: 11px;
            text-align: center;
        }

        .popup-ans {
            min-width: 285px;
            max-width: 380px;
            line-height: 1.45;
        }

        .popup-ans h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #1b2631;
        }

        .estado-popup {
            display: inline-block;
            margin-bottom: 9px;
            padding: 5px 9px;
            border-radius: 5px;
            color: #ffffff;
            font-weight: 700;
        }

        .dato-popup {
            margin-bottom: 4px;
        }

        .observacion-popup {
            margin-top: 8px;
            padding: 7px;
            border-radius: 5px;
            background: #f4f6f7;
            max-height: 100px;
            overflow-y: auto;
        }

        .popup-ans a {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 6px;
            background: #2471a3;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
        }

        #toast {
            display: none;
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 20px;
            border-radius: 8px;
            background: #1e8449;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.30);
            z-index: 10000;
            font-weight: 600;
        }

        @media (max-width: 720px) {

            .panel {
                top: 10px;
                right: 10px;
                width: calc(100% - 20px);
                max-height: 55vh;
            }
        }

    </style>

</head>

<body>

    <div id="map"></div>

    <div class="panel">

        <h2>Mapa ANS</h2>

        <div class="subtitulo">
            ELITE Ingenieros
        </div>

        <label for="buscarPedido">
            Buscar pedido
        </label>

        <input
            id="buscarPedido"
            class="campo"
            type="text"
            placeholder="Ingrese ID_ORDEN"
        >

        <div class="fila-botones">

            <button
                class="boton"
                onclick="buscarPedido()"
            >
                Buscar
            </button>

            <button
                class="boton boton-secundario"
                onclick="limpiarBusqueda()"
            >
                Limpiar
            </button>

        </div>

        <label>
            Filtrar por estado
        </label>

        <div class="estados">

            <button
                class="estado"
                style="background:#00B050"
                onclick="filtrarEstado('A TIEMPO')"
            >
                A TIEMPO
            </button>

            <button
                class="estado estado-alerta"
                style="background:#F4D03F"
                onclick="filtrarEstado('ALERTA')"
            >
                ALERTA
            </button>

            <button
                class="estado"
                style="background:#E74C3C"
                onclick="filtrarEstado('VENCIDO')"
            >
                VENCIDO
            </button>

            <button
                class="estado"
                style="background:#5D6D7E"
                onclick="filtrarEstado(
                    'PENDIENTE CONFIGURACIÓN'
                )"
            >
                PENDIENTE
            </button>

            <button
                class="estado"
                style="
                    background:#34495E;
                    grid-column:1 / span 2;
                "
                onclick="mostrarTodos()"
            >
                MOSTRAR TODOS
            </button>

        </div>

        <label for="regionFiltro">
            Región
        </label>

        <select
            id="regionFiltro"
            class="selector"
            onchange="filtrarRegion()"
        >
            <option value="">
                Todas las regiones
            </option>
        </select>

        <label for="zonaFiltro">
            Zona
        </label>

        <select
            id="zonaFiltro"
            class="selector"
            onchange="filtrarZona()"
        >
            <option value="">
                Todas las zonas
            </option>
        </select>

        <label for="municipioFiltro">
            Municipio
        </label>

        <select
            id="municipioFiltro"
            class="selector"
            onchange="filtrarMunicipio()"
        >
            <option value="">
                Todos los municipios
            </option>
        </select>

        <div class="fila-botones">

            <button
                class="boton boton-azul"
                onclick="centrarMapa()"
            >
                Centrar mapa
            </button>

            <button
                class="boton boton-copiar"
                onclick="copiarPedidoSeleccionado()"
            >
                Copiar datos
            </button>

        </div>

        <div
            id="contador"
            class="contador"
        >
            Registros visibles: 0
        </div>

        <div class="nota">
            El visor muestra únicamente los pedidos que cuentan
            con coordenadas obtenidas a partir de la dirección.
        </div>

        <div class="fecha">
            Generado: 05/08/2026 11:37:51
        </div>

    </div>

    <div id="toast"></div>

        const centroInicial = [
            5.0689,
            -75.5174
        ];

        const zoomInicial = 12;

        const map = L.map(
            "map"
        ).setView(
            centroInicial,
            zoomInicial
        );

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);

        let marcadores = [];
        let marcadorSeleccionado = null;

        let estadoActivo = "";
        let regionActiva = "";
        let zonaActiva = "";
        let municipioActivo = "";

        function crearIcono(color) {

            return L.divIcon({
                className: "",
                html: `
                    <div style="
                        width:24px;
                        height:24px;
                        border-radius:50% 50% 50% 0;
                        transform:rotate(-45deg);
                        background:${color};
                        border:3px solid #ffffff;
                        box-shadow:0 2px 7px rgba(0,0,0,.45);
                    ">
                        <div style="
                            width:7px;
                            height:7px;
                            margin:6px;
                            border-radius:50%;
                            background:#ffffff;
                        ">
                        </div>
                    </div>
                `,
                iconSize: [30, 30],
                iconAnchor: [15, 30],
                popupAnchor: [0, -28]
            });
        }

        function escaparHtml(valor) {

            return String(valor ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function construirPopup(registro) {

            return `
                <div class="popup-ans">

                    <h3>
                        Pedido ${escaparHtml(registro.pedido)}
                    </h3>

                    <span
                        class="estado-popup"
                        style="background:${registro.color}"
                    >
                        ${escaparHtml(registro.estado)}
                    </span>

                    <div class="dato-popup">
                        <b>Dirección:</b>
                        ${escaparHtml(registro.direccion)}
                    </div>

                    <div class="dato-popup">
                        <b>Municipio:</b>
                        ${escaparHtml(registro.municipio)}
                    </div>

                    <div class="dato-popup">
                        <b>Región:</b>
                        ${escaparHtml(registro.region)}
                    </div>

                    <div class="dato-popup">
                        <b>Zona:</b>
                        ${escaparHtml(registro.zona)}
                    </div>

                    <div class="dato-popup">
                        <b>Propietario:</b>
                        ${escaparHtml(registro.propietario)}
                    </div>

                    <div class="dato-popup">
                        <b>Días restantes:</b>
                        ${escaparHtml(registro.dias_restantes)}
                    </div>

                    <div class="observacion-popup">
                        <b>Observación:</b><br>
                        ${escaparHtml(registro.observacion)}
                    </div>

                    <a
                        href="${registro.url_google_maps}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Abrir en Google Maps
                    </a>

                </div>
            `;
        }

        function agregarOpcion(
            selectorId,
            valor
        ) {

            const selector = document.getElementById(
                selectorId
            );

            const opcion = document.createElement(
                "option"
            );

            opcion.value = valor;
            opcion.textContent = valor;

            selector.appendChild(
                opcion
            );
        }

        function crearMarcadores() {

            const regiones = new Set();
            const zonas = new Set();
            const municipios = new Set();

            registros.forEach(registro => {

                const marcador = L.marker(
                    [
                        registro.latitud,
                        registro.longitud
                    ],
                    {
                        icon: crearIcono(
                            registro.color
                        )
                    }
                );

                marcador.registro = registro;

                marcador.bindPopup(
                    construirPopup(registro)
                );

                marcador.on(
                    "click",
                    () => {
                        marcadorSeleccionado = marcador;
                    }
                );

                marcador.addTo(map);

                marcadores.push(
                    marcador
                );

                if (registro.region) {
                    regiones.add(
                        registro.region
                    );
                }

                if (registro.zona) {
                    zonas.add(
                        registro.zona
                    );
                }

                if (registro.municipio) {
                    municipios.add(
                        registro.municipio
                    );
                }
            });

            Array.from(regiones)
                .sort()
                .forEach(valor => {
                    agregarOpcion(
                        "regionFiltro",
                        valor
                    );
                });

            Array.from(zonas)
                .sort()
                .forEach(valor => {
                    agregarOpcion(
                        "zonaFiltro",
                        valor
                    );
                });

            Array.from(municipios)
                .sort()
                .forEach(valor => {
                    agregarOpcion(
                        "municipioFiltro",
                        valor
                    );
                });

            actualizarContador();
        }

        function cumpleFiltros(marcador) {

            const registro = marcador.registro;

            const cumpleEstado =
                !estadoActivo
                || registro.estado === estadoActivo;

            const cumpleRegion =
                !regionActiva
                || registro.region === regionActiva;

            const cumpleZona =
                !zonaActiva
                || registro.zona === zonaActiva;

            const cumpleMunicipio =
                !municipioActivo
                || registro.municipio === municipioActivo;

            return (
                cumpleEstado
                && cumpleRegion
                && cumpleZona
                && cumpleMunicipio
            );
        }

        function aplicarFiltros() {

            marcadores.forEach(marcador => {

                if (cumpleFiltros(marcador)) {

                    if (!map.hasLayer(marcador)) {
                        marcador.addTo(map);
                    }

                } else {

                    if (map.hasLayer(marcador)) {
                        map.removeLayer(marcador);
                    }
                }
            });

            actualizarContador();
        }

        function filtrarEstado(estado) {

            estadoActivo = estado;
            aplicarFiltros();
        }

        function filtrarRegion() {

            regionActiva = document
                .getElementById("regionFiltro")
                .value;

            aplicarFiltros();
        }

        function filtrarZona() {

            zonaActiva = document
                .getElementById("zonaFiltro")
                .value;

            aplicarFiltros();
        }

        function filtrarMunicipio() {

            municipioActivo = document
                .getElementById("municipioFiltro")
                .value;

            aplicarFiltros();
        }

        function mostrarTodos() {

            estadoActivo = "";
            regionActiva = "";
            zonaActiva = "";
            municipioActivo = "";

            document.getElementById(
                "regionFiltro"
            ).value = "";

            document.getElementById(
                "zonaFiltro"
            ).value = "";

            document.getElementById(
                "municipioFiltro"
            ).value = "";

            marcadores.forEach(marcador => {

                if (!map.hasLayer(marcador)) {
                    marcador.addTo(map);
                }
            });

            actualizarContador();
            centrarMapa();
        }

        function buscarPedido() {

            const valor = document
                .getElementById("buscarPedido")
                .value
                .trim()
                .toUpperCase();

            if (!valor) {

                mostrarToast(
                    "Ingrese un ID_ORDEN."
                );

                return;
            }

            const encontrado = marcadores.find(
                marcador =>
                    marcador.registro.pedido
                        .toUpperCase() === valor
            );

            if (!encontrado) {

                mostrarToast(
                    "El pedido no está disponible en el mapa."
                );

                return;
            }

            marcadores.forEach(marcador => {

                if (
                    marcador !== encontrado
                    && map.hasLayer(marcador)
                ) {
                    map.removeLayer(
                        marcador
                    );
                }
            });

            if (!map.hasLayer(encontrado)) {
                encontrado.addTo(map);
            }

            marcadorSeleccionado = encontrado;

            map.setView(
                encontrado.getLatLng(),
                17
            );

            encontrado.openPopup();

            actualizarContador();
        }

        function limpiarBusqueda() {

            document.getElementById(
                "buscarPedido"
            ).value = "";

            marcadorSeleccionado = null;

            mostrarTodos();
        }

        function centrarMapa() {

            const visibles = marcadores.filter(
                marcador => map.hasLayer(marcador)
            );

            if (visibles.length === 0) {

                map.setView(
                    centroInicial,
                    zoomInicial
                );

                return;
            }

            if (visibles.length === 1) {

                map.setView(
                    visibles[0].getLatLng(),
                    16
                );

                return;
            }

            const grupo = L.featureGroup(
                visibles
            );

            map.fitBounds(
                grupo.getBounds().pad(0.20)
            );
        }

        function actualizarContador() {

            const visibles = marcadores.filter(
                marcador => map.hasLayer(marcador)
            ).length;

            document.getElementById(
                "contador"
            ).textContent =
                `Registros visibles: ${visibles}`;
        }

        function copiarPedidoSeleccionado() {

            if (!marcadorSeleccionado) {

                mostrarToast(
                    "Seleccione primero un marcador."
                );

                return;
            }

            const registro = (
                marcadorSeleccionado.registro
            );

            const texto = [
                `Pedido: ${registro.pedido}`,
                `Estado: ${registro.estado}`,
                `Dirección: ${registro.direccion}`,
                `Municipio: ${registro.municipio}`,
                `Región: ${registro.region}`,
                `Zona: ${registro.zona}`,
                `Propietario: ${registro.propietario}`,
                `Días restantes: ${registro.dias_restantes}`,
                `Observación: ${registro.observacion}`,
                `Ubicación: ${registro.url_google_maps}`
            ].join("\n");

            navigator.clipboard
                .writeText(texto)
                .then(() => {

                    mostrarToast(
                        "Información copiada correctamente."
                    );
                })
                .catch(() => {

                    mostrarToast(
                        "No fue posible copiar la información."
                    );
                });
        }

        function mostrarToast(mensaje) {

            const toast = document.getElementById(
                "toast"
            );

            toast.textContent = mensaje;
            toast.style.display = "block";

            setTimeout(
                () => {
                    toast.style.display = "none";
                },
                2500
            );
        }

        crearMarcadores();

        setTimeout(
            centrarMapa,
            300
        );

    </script>

</body>

</html>
